<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://img.icons8.com/color/96/amazon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hiver AI Support Agent · @AmazonHelp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', system-ui, sans-serif;
        background-color: #060b18;
        color: #e2e8f0;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Animated mesh gradient background */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(ellipse 80% 60% at 10% 10%, rgba(99,102,241,0.15) 0%, transparent 60%),
          radial-gradient(ellipse 60% 50% at 90% 80%, rgba(139,92,246,0.12) 0%, transparent 60%),
          radial-gradient(ellipse 70% 60% at 50% 50%, rgba(6,182,212,0.06) 0%, transparent 60%),
          linear-gradient(160deg, #060b18 0%, #0c1426 50%, #080d1f 100%);
        pointer-events: none;
      }

      /* Subtle grid overlay */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 48px 48px;
        pointer-events: none;
        mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
        -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
      }

      #root {
        position: relative;
        z-index: 1;
        min-height: 100vh;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(99,102,241,0.5); }

      /* Textarea placeholder */
      textarea::placeholder { color: #334155; }
      textarea:focus { outline: none; }

      /* Smooth selection */
      ::selection { background: rgba(99,102,241,0.35); color: #e2e8f0; }

      .simulator-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }

      @media (max-width: 760px) {
        .simulator-grid, .stats-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
